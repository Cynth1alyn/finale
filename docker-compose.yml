version: '3.8'

services:
  mysql:
    image: mysql:8.1
    container_name: techjob-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: examplepassword
      MYSQL_DATABASE: techjob
      MYSQL_USER: techjob
      MYSQL_PASSWORD: techjob123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: techjob-phpmyadmin
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: techjob
      PMA_PASSWORD: techjob123
      PMA_ARBITRARY: 1

volumes:
  mysql_data:
